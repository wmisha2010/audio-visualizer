<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Deep Audio Visualizer - ArtistryAI</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- External Libraries for p5.js and ID3 Metadata Tag Reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/lib/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #030408;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            user-select: none;
            -webkit-touch-callout: none;
        }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        #ui-container {
            position: absolute;
            bottom: max(10px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 92%;
            max-width: 480px;
            gap: 8px;
            pointer-events: none;
        }

        .interactive { pointer-events: auto; }

        #playlist-toggle {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #playlist-toggle:hover { color: #fff; border-color: rgba(255, 255, 255, 0.3); }

        .player-panel {
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 12px 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .track-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        #track-title {
            font-weight: 600;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        #track-time {
            color: #94a3b8;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            width: 0%;
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .ctrl-btn:active { transform: scale(0.95); }

        .ctrl-btn.main-play {
            width: 44px;
            height: 44px;
            background: #38bdf8;
            color: #030408;
        }
        .ctrl-btn.main-play:hover { background: #7dd3fc; }

        #playlist-modal {
            position: absolute;
            bottom: 100%;
            left: 0;
            width: 100%;
            max-height: 220px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            margin-bottom: 8px;
            overflow-y: auto;
            display: none;
            backdrop-filter: blur(20px);
            z-index: 11;
        }
        #playlist-modal.active { display: block; }

        .playlist-item {
            padding: 10px 16px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #94a3b8;
        }
        .playlist-item:last-child { border-bottom: none; }
        .playlist-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .playlist-item.active { color: #38bdf8; font-weight: 600; }
    </style>
</head>
<body>

    <div id="ui-container">
        <div id="playlist-modal" class="interactive"></div>
        
        <button id="playlist-toggle" class="interactive">
            <span>🎵 Открыть плейлист (<span id="track-count">1</span>)</span>
        </button>

        <div class="player-panel interactive">
            <div class="track-info">
                <span id="track-title">Загрузка...</span>
                <span id="track-time">00:00 / 00:00</span>
            </div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="controls">
                <button class="ctrl-btn" id="prev-btn" title="Предыдущий">⏮</button>
                <button class="ctrl-btn main-play" id="play-btn" title="Воспроизвести">▶</button>
                <button class="ctrl-btn" id="next-btn" title="Следующий">⏭</button>
                <button class="ctrl-btn" id="stop-btn" title="Стоп">⏹</button>
            </div>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous" preload="auto"></audio>

    <script>
        const playlist = [
            {
                title: "SiberiaRU124 — Six-Seven",
                url: "https://raw.githubusercontent.com/wmisha2010/audio-visualizer/main/music/%40SiberiaRU124%20-%20Six-Seven.mp3"
            }
        ];

        let currentTrackIndex = 0;
        let audio = document.getElementById('audio-player');
        let audioCtx, analyser, sourceNode;
        let isInitialized = false;

        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const trackTitle = document.getElementById('track-title');
        const trackTime = document.getElementById('track-time');
        const playlistToggle = document.getElementById('playlist-toggle');
        const playlistModal = document.getElementById('playlist-modal');
        const trackCount = document.getElementById('track-count');

        trackCount.textContent = playlist.length;

        function loadTrack(index) {
            currentTrackIndex = index;
            audio.src = playlist[index].url;
            trackTitle.textContent = playlist[index].title;
            updatePlaylistUI();
        }

        function initAudioContext() {
            if (isInitialized) return;
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512;

                sourceNode = audioCtx.createMediaElementSource(audio);
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                isInitialized = true;
            } catch (e) {
                console.error("AudioContext initialization error:", e);
            }
        }

        playBtn.addEventListener('click', async () => {
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            if (audio.paused) {
                audio.play().then(() => {
                    playBtn.textContent = '⏸';
                }).catch(err => console.error("Playback error:", err));
            } else {
                audio.pause();
                playBtn.textContent = '▶';
            }
        });

        stopBtn.addEventListener('click', () => {
            audio.pause();
            audio.currentTime = 0;
            playBtn.textContent = '▶';
        });

        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();
            playBtn.textContent = '⏸';
        });

        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();
            playBtn.textContent = '⏸';
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
                
                const curM = Math.floor(audio.currentTime / 60);
                const curS = Math.floor(audio.currentTime % 60);
                const durM = Math.floor(audio.duration / 60) || 0;
                const durS = Math.floor(audio.duration % 60) || 0;

                trackTime.textContent = `${String(curM).padStart(2,'0')}:${String(curS).padStart(2,'0')} / ${String(durM).padStart(2,'0')}:${String(durS).padStart(2,'0')}`;
            }
        });

        audio.addEventListener('ended', () => {
            nextBtn.click();
        });

        playlistToggle.addEventListener('click', () => {
            playlistModal.classList.toggle('active');
        });

        function updatePlaylistUI() {
            playlistModal.innerHTML = '';
            playlist.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${idx === currentTrackIndex ? 'active' : ''}`;
                item.textContent = track.title;
                item.addEventListener('click', () => {
                    loadTrack(idx);
                    initAudioContext();
                    audio.play();
                    playBtn.textContent = '⏸';
                    playlistModal.classList.remove('active');
                });
                playlistModal.appendChild(item);
            });
        }

        // p5.js Visualizer Variables & Setup
        let particles = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            angleMode(DEGREES);
            loadTrack(0);

            // Инициализация частиц для фона
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: random(width),
                    y: random(height),
                    size: random(1, 3),
                    speed: random(0.2, 1)
                });
            }
        }

        function draw() {
            background(3, 4, 8, 40);

            let bassVal = 30;
            if (analyser && isInitialized) {
                let spectrum = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(spectrum);
                
                let bassSum = 0;
                for (let i = 0; i < 10; i++) bassSum += spectrum[i];
                bassVal = bassSum / 10;
            }

            // Отрисовка фоновых частиц
            noStroke();
            fill(255, 255, 255, 100);
            for (let p of particles) {
                ellipse(p.x, p.y, p.size);
                p.y -= p.speed;
                if (p.y < 0) p.y = height;
            }

            let cx = width / 2;
            let cy = height / 2;
            let baseRadius = min(width, height) * 0.22;
            let smoothBass = baseRadius + bassVal * 0.6;

            // Центральный анимированный круг-визуализатор
            push();
            translate(cx, cy);
            noFill();
            stroke(56, 189, 248, 180);
            strokeWeight(3);
            beginShape();
            for (let i = 0; i < 360; i += 4) {
                let r = smoothBass + sin(i * 4 + frameCount * 2) * (bassVal * 0.3);
                let x = r * cos(i);
                let y = r * sin(i);
                vertex(x, y);
            }
            endShape(CLOSE);

            // Внутренний контур логотипа / обложки
            fill(15, 23, 42, 200);
            stroke(255, 255, 255, 30);
            strokeWeight(1);
            ellipse(0, 0, baseRadius * 1.4, baseRadius * 1.4);
            pop();
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
