<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Deep Audio Visualizer - ArtistryAI</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- External Libraries for p5.js and ID3 Metadata Tag Reading -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #030408;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      user-select: none;
      -webkit-touch-callout: none;
    }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    
    #ui-container {
      position: absolute;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
      width: min(94%, 500px);
      pointer-events: none;
    }

    #ui-container > * {
      pointer-events: auto;
    }

    /* Кнопка быстрого доступа к плейлисту */
    #btn-toggle-playlist {
      width: 100%;
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #38bdf8;
      padding: 8px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(12px);
    }

    #playlist-panel {
      width: 100%;
      max-height: 35vh;
      background: rgba(13, 17, 28, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    #playlist-panel.hidden {
      display: none;
    }

    #playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      font-weight: 600;
      color: #a5b4fc;
    }

    #track-list {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      max-height: 25vh;
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }

    #track-list::-webkit-scrollbar {
      width: 4px;
    }
    #track-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    .track-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .track-item.active {
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(99, 102, 241, 0.5);
      color: #38bdf8;
      font-weight: 600;
    }

    .track-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
    }

    .btn-remove {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }

    #progress-container {
      width: 100%;
      background: rgba(13, 17, 28, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 8px 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #track-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #9ca3af;
    }

    #track-title {
      font-weight: 600;
      color: #e5e7eb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    #time-display {
      font-family: monospace;
      font-size: 11px;
      color: #a5b4fc;
    }

    #seeker-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    #seeker-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #06b6d4);
      border-radius: 4px;
      pointer-events: none;
      transition: width 0.05s linear;
    }

    #ui-panel {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: rgba(13, 17, 28, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      padding: 6px 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    
    .btn-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    button, label.btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    button:active, label.btn:active { transform: scale(0.95); }
    button:disabled { background: rgba(255,255,255,0.08); color: #555; cursor: not-allowed; }
    input[type="file"] { display: none; }

    .btn-nav {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 8px;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #volume-slider {
      width: 45px;
      accent-color: #6366f1;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <button id="btn-toggle-playlist">📋 Открыть плейлист (<span id="playlist-count">0</span>)</button>

    <div id="playlist-panel" class="hidden">
      <div id="playlist-header">
        <span>📜 Список треков</span>
        <span style="font-size:10px; opacity:0.7;">ArtistryAI</span>
      </div>
      <ul id="track-list"></ul>
    </div>

    <div id="progress-container">
      <div id="track-info">
        <span id="track-title">Загрузка...</span>
        <span id="time-display">00:00 / 00:00</span>
      </div>
      <div id="seeker-bg">
        <div id="seeker-fill"></div>
      </div>
    </div>

    <div id="ui-panel">
      <div class="btn-group">
        <label class="btn" for="audio-file" title="Добавить треки">➕</label>
        <input type="file" id="audio-file" accept="audio/*" multiple>
        
        <button id="btn-prev" class="btn-nav" disabled>⏮</button>
        <button id="btn-play" disabled>▶</button>
        <button id="btn-next" class="btn-nav" disabled>⏭</button>
        <button id="btn-stop" disabled>⏹</button>
      </div>

      <div class="volume-container">
        <span id="vol-icon" style="font-size:14px; cursor:pointer;">🔊</span>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
      </div>
    </div>
  </div>

  <audio id="audio-player"></audio>

  <script>
    const DB_NAME = "AudioVisualizerDB";
    const STORE_NAME = "tracks";
    let db = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
          }
        };
        request.onsuccess = (e) => { db = e.target.result; resolve(db); };
        request.onerror = (e) => reject(e);
      });
    }

    function saveTrackToDB(trackObj) {
      return new Promise((resolve, reject) => {
        if (!db) return resolve();
        const transaction = db.transaction([STORE_NAME], "readwrite");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.put(trackObj);
        request.onsuccess = () => resolve(request.result);
        request.onerror = (e) => reject(e);
      });
    }

    function getAllTracksFromDB() {
      return new Promise((resolve, reject) => {
        if (!db) return resolve([]);
        const transaction = db.transaction([STORE_NAME], "readonly");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = (e) => reject(e);
      });
    }

    function deleteTrackFromDB(id) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], "readwrite");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.delete(id);
        request.onsuccess = () => resolve();
        request.onerror = (e) => reject(e);
      });
    }

    let audioContext, analyser, sourceNode, gainNode;
    let audioElem;
    let isConnected = false;

    let playlist = []; 
    let currentTrackIndex = -1;
    let coverImg = null;
    let smoothBass = 0;
    let ambientParticles = [];
    const numBars = 32; 
    let barValues = new Array(numBars).fill(0);
    let peakValues = new Array(numBars).fill(0);

    function setup() {
      createCanvas(windowWidth, windowHeight);
      angleMode(DEGREES);
      audioElem = document.getElementById('audio-player');
      for (let i = 0; i < 80; i++) {
        ambientParticles.push(new AmbientParticle());
      }
    }

    function initAudio() {
      if (!isConnected) {
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.5;

          gainNode = audioContext.createGain();
          gainNode.gain.value = document.getElementById('volume-slider').value;

          sourceNode = audioContext.createMediaElementSource(audioElem);
          sourceNode.connect(analyser);
          analyser.connect(gainNode);
          gainNode.connect(audioContext.destination);

          isConnected = true;
        } catch (err) {
          console.error("Audio Context Init error:", err);
        }
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }

    function draw() {
      background(3, 4, 8);
      let spectrum = new Uint8Array(128);
      let targetBass = 0;

      if (isConnected && analyser) {
        analyser.getByteFrequencyData(spectrum);
        targetBass = (spectrum[0] + spectrum[1] + spectrum[2] + spectrum[3]) / 4;
      }

      smoothBass = lerp(smoothBass, targetBass, 0.15);
      
      translate(width / 2, (height / 2) - 45);

      for (let p of ambientParticles) {
        p.update(smoothBass);
        p.show();
      }

      let baseRadius = 90 + map(smoothBass, 0, 255, 0, 30);
      let bassFactor = pow(smoothBass / 255, 1.4);
      let barWidth = map(baseRadius, 90, 120, 10, 15);
      let maxBlocks = 9;

      for (let i = 0; i < numBars; i++) {
        let angle = map(i, 0, numBars, 0, 360);
        let specIdx = i < numBars / 2 ? Math.floor(map(i, 0, numBars / 2, 0, 40)) : Math.floor(map(numBars - i, 0, numBars / 2, 0, 40));
        let rawVal = (spectrum[specIdx] || 0) / 255;
        let targetLevel = Math.floor(pow(rawVal, 1.2) * maxBlocks * map(bassFactor, 0, 1, 1.1, 1.8));

        if (targetLevel > barValues[i]) barValues[i] = targetLevel;
        else barValues[i] = lerp(barValues[i], targetLevel, 0.22);

        if (barValues[i] >= peakValues[i]) peakValues[i] = barValues[i];
        else peakValues[i] = max(0, peakValues[i] - 0.2);

        push();
        rotate(angle);
        let activeBlocks = Math.round(barValues[i]);
        for (let b = 0; b < activeBlocks; b++) {
          let blockDist = baseRadius + 12 + b * 11;
          let colRatio = b / maxBlocks;
          fill(map(colRatio, 0, 1, 99, 0), map(colRatio, 0, 1, 102, 240), 255, 230);
          noStroke();
          rect(-barWidth / 2, blockDist, barWidth, 7, 2);
        }
        if (peakValues[i] > 0.5) {
          fill(0, 240, 255, 255);
          noStroke();
          rect(-barWidth / 2, baseRadius + 12 + peakValues[i] * 11, barWidth, 3, 1);
        }
        pop();
      }

      drawSpeaker(baseRadius, smoothBass);
    }

    function drawSpeaker(radius, bassVal) {
      push();
      noFill();
      stroke(99, 102, 241, map(bassVal, 0, 255, 20, 100));
      strokeWeight(12);
      ellipse(0, 0, radius * 2 + 14, radius * 2 + 14);

      fill(16, 19, 28);
      stroke(35, 42, 60);
      strokeWeight(5);
      ellipse(0, 0, radius * 2 + 6, radius * 2 + 6);

      fill(8, 10, 16);
      noStroke();
      ellipse(0, 0, radius * 1.85, radius * 1.85);

      if (coverImg) {
        imageMode(CENTER);
        let masked = coverImg.get();
        masked.mask(createCircleMask(radius * 1.4));
        image(masked, 0, 0, radius * 1.4, radius * 1.4);
      } else {
        fill(20, 25, 40);
        stroke(255, 255, 255, 40);
        strokeWeight(1.5);
        ellipse(0, 0, radius * 1.35, radius * 1.35);

        textAlign(CENTER, CENTER);
        textStyle(BOLD);
        textSize(18);
        fill(255);
        noStroke();
        text("ArtistryAI", 0, 0);
      }
      pop();
    }

    function createCircleMask(dim) {
      let pg = createGraphics(dim, dim);
      pg.ellipse(dim / 2, dim / 2, dim, dim);
      return pg;
    }

    class AmbientParticle {
      constructor() { this.reset(); }
      reset() {
        this.angle = random(360);
        this.dist = random(100, max(width, height) / 2);
        this.speed = random(0.2, 0.6);
        this.size = random(1.5, 3);
        this.alpha = random(40, 120);
      }
      update(bass) {
        this.dist += this.speed + map(bass, 0, 255, 0, 1.5);
        if (this.dist > max(width, height) / 1.5) { this.reset(); this.dist = 100; }
      }
      show() {
        let x = this.dist * cos(this.angle);
        let y = this.dist * sin(this.angle);
        noStroke();
        fill(147, 197, 253, this.alpha);
        ellipse(x, y, this.size, this.size);
      }
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      let mins = Math.floor(seconds / 60);
      let secs = Math.floor(seconds % 60);
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    window.onload = async () => {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }

      await initDB();

      const fileInput = document.getElementById('audio-file');
      const btnPlay = document.getElementById('btn-play');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const btnStop = document.getElementById('btn-stop');
      const btnTogglePlaylist = document.getElementById('btn-toggle-playlist');
      const playlistPanel = document.getElementById('playlist-panel');
      const trackListElem = document.getElementById('track-list');
      const playlistCountElem = document.getElementById('playlist-count');
      const trackTitle = document.getElementById('track-title');
      const timeDisplay = document.getElementById('time-display');
      const seekerBg = document.getElementById('seeker-bg');
      const seekerFill = document.getElementById('seeker-fill');
      const volumeSlider = document.getElementById('volume-slider');
      const volIcon = document.getElementById('vol-icon');

      let isDragging = false;

      function updateNavButtons() {
        const hasTracks = playlist.length > 0;
        btnPlay.disabled = !hasTracks;
        btnStop.disabled = !hasTracks;
        btnPrev.disabled = !hasTracks || playlist.length <= 1;
        btnNext.disabled = !hasTracks || playlist.length <= 1;
      }

      async function loadTracks() {
        // Треки из репозитория GitHub
        let remoteTracks = [
          {
            id: 'remote_1',
            name: 'SiberiaRU124 — Six-Seven',
            url: 'https://raw.githubusercontent.com/wmisha2010/audio-visualizer/main/music/%40SiberiaRU124%20-%20Six-Seven.mp3',
            isRemote: true
          }
        ];

        let dbTracks = await getAllTracksFromDB();
        playlist = [...remoteTracks, ...dbTracks];

        playlistCountElem.innerText = playlist.length;
        renderPlaylistUI();
        updateNavButtons();
        
        if (playlist.length > 0 && currentTrackIndex === -1) {
          trackTitle.innerText = playlist[0].name;
        } else if (playlist.length === 0) {
          trackTitle.innerText = "Плейлист пуст. Нажмите ➕";
        }
      }

      function renderPlaylistUI() {
        trackListElem.innerHTML = "";
        playlist.forEach((track, idx) => {
          const li = document.createElement('li');
          li.className = `track-item ${idx === currentTrackIndex ? 'active' : ''}`;
          
          const nameSpan = document.createElement('span');
          nameSpan.className = 'track-name';
          nameSpan.innerText = `${idx + 1}. ${track.name}`;
          nameSpan.onclick = () => playTrack(idx);

          li.appendChild(nameSpan);

          const btnDel = document.createElement('button');
          btnDel.className = 'btn-remove';
          btnDel.innerText = '✕';
          btnDel.onclick = async (e) => {
            e.stopPropagation();
            if (track.isRemote) {
              alert("Этот трек загружен из репозитория GitHub.");
              return;
            }
            await deleteTrackFromDB(track.id);
            playlist.splice(idx, 1);
            renderPlaylistUI();
            playlistCountElem.innerText = playlist.length;
            updateNavButtons();
            if (currentTrackIndex === idx) {
              audioElem.pause();
              currentTrackIndex = -1;
              trackTitle.innerText = "Трек удален";
            }
          };
          li.appendChild(btnDel);

          trackListElem.appendChild(li);
        });
      }

      function playTrack(index) {
        if (index < 0 || index >= playlist.length) return;
        initAudio();
        
        currentTrackIndex = index;
        const track = playlist[index];
        
        let playSrc = track.isRemote ? track.url : URL.createObjectURL(track.blob);
        
        audioElem.src = playSrc;
        audioElem.play().then(() => {
          btnPlay.innerText = "⏸";
          updateNavButtons();
        }).catch(err => console.log("Playback error:", err));

        trackTitle.innerText = track.name;
        coverImg = null;
        renderPlaylistUI();

        if (!track.isRemote && track.blob && window.jsmediatags) {
          window.jsmediatags.read(track.blob, {
            onSuccess: function(tag) {
              const tags = tag.tags;
              if (tags.title || tags.artist) {
                trackTitle.innerText = `${tags.artist || 'Автор'} — ${tags.title || track.name}`;
              }
              if (tags.picture) {
                let base64String = "";
                for (let i = 0; i < tags.picture.data.length; i++) {
                  base64String += String.fromCharCode(tags.picture.data[i]);
                }
                let imageUrl = `data:${tags.picture.format};base64,${window.btoa(base64String)}`;
                loadImage(imageUrl, (img) => { coverImg = img; });
              }
            }
          });
        }
      }

      function playNextTrack() {
        if (playlist.length === 0) return;
        playTrack((currentTrackIndex + 1) % playlist.length);
      }

      function playPrevTrack() {
        if (playlist.length === 0) return;
        playTrack((currentTrackIndex - 1 + playlist.length) % playlist.length);
      }

      fileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        for (let file of files) {
          const customTrack = {
            id: 'local_' + Date.now() + Math.random(),
            name: file.name,
            blob: file,
            isRemote: false,
            addedAt: Date.now()
          };
          await saveTrackToDB(customTrack);
          playlist.push(customTrack);
        }
        playlistCountElem.innerText = playlist.length;
        renderPlaylistUI();
        updateNavButtons();
        if (currentTrackIndex === -1 && playlist.length > 0) playTrack(0);
      });

      btnTogglePlaylist.addEventListener('click', () => { playlistPanel.classList.toggle('hidden'); });
      btnPrev.addEventListener('click', playPrevTrack);
      btnNext.addEventListener('click', playNextTrack);
      audioElem.addEventListener('ended', playNextTrack);

      audioElem.addEventListener('timeupdate', () => {
        if (!isDragging && audioElem.duration) {
          let progress = (audioElem.currentTime / audioElem.duration) * 100;
          seekerFill.style.width = `${progress}%`;
          timeDisplay.innerText = `${formatTime(audioElem.currentTime)} / ${formatTime(audioElem.duration)}`;
        }
      });

      function setAudioPosition(e) {
        if (!audioElem.duration) return;
        const rect = seekerBg.getBoundingClientRect();
        let clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        let clickX = clientX - rect.left;
        clickX = Math.max(0, Math.min(clickX, rect.width));
        const percentage = clickX / rect.width;
        audioElem.currentTime = percentage * audioElem.duration;
      }

      seekerBg.addEventListener('pointerdown', (e) => {
        isDragging = true;
        setAudioPosition(e);
      });
      window.addEventListener('pointermove', (e) => { if (isDragging) setAudioPosition(e); });
      window.addEventListener('pointerup', () => { isDragging = false; });

      btnPlay.addEventListener('click', () => {
        initAudio();
        if (audioElem.paused) {
          if (currentTrackIndex === -1 && playlist.length > 0) playTrack(0);
          else { audioElem.play(); btnPlay.innerText = "⏸"; }
        } else {
          audioElem.pause();
          btnPlay.innerText = "▶";
        }
      });

      btnStop.addEventListener('click', () => {
        audioElem.pause();
        audioElem.currentTime = 0;
        btnPlay.innerText = "▶";
      });

      volumeSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        if (gainNode) gainNode.gain.value = val;
        audioElem.volume = val;
        volIcon.innerText = val === 0 ? '🔇' : (val < 0.5 ? '🔉' : '🔊');
      });

      await loadTracks();
    };

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
